<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewind benchmark</title>
  <link rel="stylesheet" href="panel.css">
  <style>body{max-width:980px;margin:0 auto} table{border-collapse:collapse;width:100%;font-size:13px} th,td{border:1px solid var(--line);padding:4px 6px;text-align:left} pre{white-space:pre-wrap;background:var(--soft);padding:8px;border-radius:6px}</style>
</head>
<body>
  <h1>Rewind in-browser benchmark</h1>
  <p class="fine">Runs the evaluation questions against the bundled demo index inside the browser, so local retrieval latency is measured in the real runtime (WebAssembly, single thread). Requires the model to be downloaded once in the side panel's Setup tab.</p>
  <label for="set">Question set</label>
  <select id="set"><option value="test">test (50)</option><option value="practice">practice (15)</option></select>
  <div class="button-row" style="margin-top:8px"><button id="run">Run benchmark</button></div>
  <div id="status" class="status" aria-live="polite"></div>
  <div id="out"></div>
  <script type="module" src="bench.js"></script>
</body>
</html>
